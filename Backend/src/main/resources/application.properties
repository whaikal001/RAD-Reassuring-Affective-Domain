# Database (Supabase PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.tjvrjjlozurduqvvecso}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Whaikal2003!}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging
logging.level.com.radai=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Server
server.port=${SERVER_PORT:8080}

# CORS (frontend dev)
# handled in CorsConfig

# JWT (min 32 chars for HMAC-SHA256)
app.jwt.secret=${APP_JWT_SECRET:mySecureJWTSecretKeyFor2026RadAI123456}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# Hugging Face (defaults are commercial-friendly, override in env for prod)
hf.api.token=${HF_API_TOKEN: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}
# Use the same chat model as the Character Backend for consistency: Llama 3.1 8B Instruct
hf.chat.model=${HF_CHAT_MODEL:meta-llama/Llama-3.1-8B-Instruct}
# chat = chat-completions router endpoint, inference = model inference endpoint
hf.chat.api-mode=${HF_CHAT_API_MODE:chat}
# Emotion detection model
hf.emotion.model=${HF_EMOTION_MODEL:j-hartmann/emotion-english-distilroberta-base}
# Zero-shot classification for content screening
hf.screening.model=${HF_SCREENING_MODEL:facebook/bart-large-mnli}
# Toxicity detection for safety
hf.safety.model=${HF_SAFETY_MODEL:unitary/toxic-bert}
# Multi-language TTS: allow per-language models (English / Malay)
# Set HF_TTS_MODEL_EN and HF_TTS_MODEL_MS in env/docker-compose to choose models per language.
hf.tts.model.en=${HF_TTS_MODEL_EN:facebook/fastspeech2-en-ljspeech}
hf.tts.model.ms=${HF_TTS_MODEL_MS:mesolitica/malay-VITS-multispeaker}
# Backwards-compatible single property (falls back to EN model)
hf.tts.model=${HF_TTS_MODEL:${HF_TTS_MODEL_EN:facebook/fastspeech2-en-ljspeech}}

# PBOT USB serial bridge
pbot.usb.port=${PBOT_USB_PORT:}
pbot.usb.baud-rate=${PBOT_USB_BAUD_RATE:115200}
pbot.usb.write-timeout-ms=${PBOT_USB_WRITE_TIMEOUT_MS:1000}
