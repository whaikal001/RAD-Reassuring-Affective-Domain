# Database (Supabase PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.tjvrjjlozurduqvvecso}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Whaikal2003!}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging
logging.level.com.radai=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Server
server.port=${SERVER_PORT:8080}

# CORS (frontend dev)
# handled in CorsConfig

# JWT (min 32 chars for HMAC-SHA256)
app.jwt.secret=${APP_JWT_SECRET:mySecureJWTSecretKeyFor2026RadAI123456}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# Email verification + Google sign-in -----------------------------------------
# Frontend base URL used to build the verification link the user clicks.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
# "From" header on verification emails.
app.mail.from=${APP_MAIL_FROM:RadAI <no-reply@radai.local>}
# When false (or SMTP creds missing) the backend logs the verification link instead
# of sending it — handy before you've set up an SMTP account.
app.mail.enabled=${APP_MAIL_ENABLED:true}
# How long a verification link stays valid.
app.verification.expiry-hours=${APP_VERIFICATION_EXPIRY_HOURS:24}

# Gmail SMTP. Create a Gmail "App Password" (Google Account > Security > App passwords)
# and set MAIL_USERNAME (your gmail) + MAIL_PASSWORD (the 16-char app password) in env.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Google OAuth Web client ID (Google Cloud Console > Credentials). Used to verify the
# ID token the browser sends. Public value; env var overrides this default.
app.google.client-id=${GOOGLE_CLIENT_ID:65097917118-vqhnf26pebhkrprm6k5c1cia2de3qh95.apps.googleusercontent.com}

# Hugging Face (defaults are commercial-friendly, override in env for prod)
hf.api.token=${HF_API_TOKEN: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}
# Use the same chat model as the Character Backend for consistency: Llama 3.1 8B Instruct
hf.chat.model=${HF_CHAT_MODEL:meta-llama/Llama-3.1-8B-Instruct}
# chat = chat-completions router endpoint, inference = model inference endpoint
hf.chat.api-mode=${HF_CHAT_API_MODE:chat}
# Emotion detection model
hf.emotion.model=${HF_EMOTION_MODEL:j-hartmann/emotion-english-distilroberta-base}
# Zero-shot classification for content screening
hf.screening.model=${HF_SCREENING_MODEL:facebook/bart-large-mnli}
# Toxicity detection for safety
hf.safety.model=${HF_SAFETY_MODEL:unitary/toxic-bert}
# Multi-language TTS: allow per-language models (English / Malay)
# Set HF_TTS_MODEL_EN and HF_TTS_MODEL_MS in env/docker-compose to choose models per language.
hf.tts.model.en=${HF_TTS_MODEL_EN:facebook/fastspeech2-en-ljspeech}
hf.tts.model.ms=${HF_TTS_MODEL_MS:mesolitica/malay-VITS-multispeaker}
# Backwards-compatible single property (falls back to EN model)
hf.tts.model=${HF_TTS_MODEL:${HF_TTS_MODEL_EN:facebook/fastspeech2-en-ljspeech}}

# RAD engine tuning (optional) --------------------------------------------------
# Numeric knobs for the decision engines, bound by EngineProperties and published to
# EngineTuning at startup. Defaults reproduce the original behaviour; override in env for tuning.
# Empathy <-> sympathy switch (combined 0-10 signal).
radai.engine.approach.high-cut=${RADAI_APPROACH_HIGH_CUT:7.0}
radai.engine.approach.low-cut=${RADAI_APPROACH_LOW_CUT:4.0}
radai.engine.approach.band-weight=${RADAI_APPROACH_BAND_WEIGHT:0.5}
radai.engine.approach.message-weight=${RADAI_APPROACH_MESSAGE_WEIGHT:0.5}
# Risk level cut-offs (0-1 score).
radai.engine.risk.critical-cut=${RADAI_RISK_CRITICAL_CUT:0.8}
radai.engine.risk.high-cut=${RADAI_RISK_HIGH_CUT:0.45}
radai.engine.risk.moderate-cut=${RADAI_RISK_MODERATE_CUT:0.2}
# Mood-trajectory classifier.
radai.engine.trajectory.min-samples=${RADAI_TRAJECTORY_MIN_SAMPLES:3}
radai.engine.trajectory.slope-threshold=${RADAI_TRAJECTORY_SLOPE_THRESHOLD:0.3}
radai.engine.trajectory.volatility-threshold=${RADAI_TRAJECTORY_VOLATILITY_THRESHOLD:2.5}
# ML classification (HuggingFace). When enabled + token present, engines use the models as the
# primary signal with the keyword/lexicon rules kept as a safety floor. Disable to run rules-only.
radai.ml.enabled=${RADAI_ML_ENABLED:true}
radai.engine.ml.emotion-min-score=${RADAI_ML_EMOTION_MIN_SCORE:0.5}
radai.engine.ml.crisis-ideation-threshold=${RADAI_ML_CRISIS_IDEATION_THRESHOLD:0.6}
radai.engine.ml.crisis-threshold=${RADAI_ML_CRISIS_THRESHOLD:0.65}

# PBOT USB serial bridge (CH340 on COM4 by default; override with PBOT_USB_PORT)
pbot.usb.port=${PBOT_USB_PORT:COM4}
pbot.usb.baud-rate=${PBOT_USB_BAUD_RATE:115200}
pbot.usb.write-timeout-ms=${PBOT_USB_WRITE_TIMEOUT_MS:1000}
# Try to open the port automatically when the backend starts (non-fatal if the robot isn't plugged in)
pbot.usb.auto-connect=${PBOT_USB_AUTO_CONNECT:true}
