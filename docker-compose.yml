services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: radai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: radai
      POSTGRES_USER: ${DB_USER:-radai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-radai123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./setup.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-radai} -d radai"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - radai-net

  # Spring Boot Backend
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: radai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Database (Supabase)
      # Database - use local postgres for demo/dev, or Supabase for production
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/radai}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-radai}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-radai123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      
      # JWT
      APP_JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-32-chars}
      APP_JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      
      # HuggingFace (optional)
      HF_API_TOKEN: ${HF_API_TOKEN:-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}
      HF_CHAT_MODEL: ${HF_CHAT_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      HF_CHAT_API_MODE: ${HF_CHAT_API_MODE:-chat}
      HF_EMOTION_MODEL: ${HF_EMOTION_MODEL:-j-hartmann/emotion-english-distilroberta-base}
      HF_SCREENING_MODEL: ${HF_SCREENING_MODEL:-facebook/bart-large-mnli}
      HF_SAFETY_MODEL: ${HF_SAFETY_MODEL:-unitary/toxic-bert}
      HF_TTS_MODEL: ${HF_TTS_MODEL:-facebook/fastspeech2-en-ljspeech}
      HF_TTS_MODEL_EN: ${HF_TTS_MODEL_EN:-facebook/fastspeech2-en-ljspeech}
      HF_TTS_MODEL_MS: ${HF_TTS_MODEL_MS:-mesolitica/malay-VITS-multispeaker}
      
      # Server
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-default}
      # Default emergency helpline (set to Malaysia emergency number)
      DEFAULT_HELPLINE: ${DEFAULT_HELPLINE:-If you're in immediate danger, call 999 (Malaysia emergency)}
    networks:
      - radai-net

  # Angular Frontend (Nginx)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: radai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - radai-net

  # R3F Character Backend (Node.js + HuggingFace Inference)
  character-backend:
    build:
      context: ./Characters/r3f-virtual-girlfriend-backend-main
      dockerfile: Dockerfile
    container_name: radai-character-backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # HuggingFace API
      HUGGINGFACE_API_KEY: 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
      
      # Chat & Voice
      HF_CHAT_MODEL: ${HF_CHAT_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      HF_TTS_MODEL_EN: ${HF_TTS_MODEL_EN:-facebook/fastspeech2-en-ljspeech}
      HF_TTS_MODEL_MS: ${HF_TTS_MODEL_MS:-microsoft/speecht5_tts}
      
      # Emotion Detection & Screening (for daily progress tracking)
      HF_EMOTION_MODEL: ${HF_EMOTION_MODEL:-j-hartmann/emotion-english-distilroberta-base}
      HF_SCREENING_MODEL: ${HF_SCREENING_MODEL:-facebook/bart-large-mnli}
      HF_SAFETY_MODEL: ${HF_SAFETY_MODEL:-unitary/toxic-bert}
      
      NODE_ENV: production
    networks:
      - radai-net
    volumes:
      - ./Characters/r3f-virtual-girlfriend-backend-main/audios:/app/audios


  # R3F Character Frontend (React + Vite)
  character-frontend:
    build:
      context: ./Characters/r3f-virtual-girlfriend-frontend-main
      dockerfile: Dockerfile
    container_name: radai-character-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001
    networks:
      - radai-net

volumes:
  postgres_data:

networks:
  radai-net:
    driver: bridge
