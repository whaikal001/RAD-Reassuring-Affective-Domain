<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060915"/>
      <stop offset="58%" stop-color="#100832"/>
      <stop offset="100%" stop-color="#2a0964"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff66ff" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#b94dff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7f3fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#flare)"/>

