<div class="container py-4">
  <div class="mb-3">
    <button class="btn btn-outline-secondary btn-sm" (click)="goBack()" [title]="'common.back' | t">
      <i class="bi bi-chevron-left me-1"></i>{{ 'common.back' | t }}
    </button>
  </div>
  <h3>Admin Analytics</h3>
  <p class="text-muted">Emotion intensity over time</p>

  <div class="card p-3 mb-4 chart-wrap">
    <canvas #chartCanvas></canvas>
  </div>

  <h4 class="mt-3">User Management</h4>
  <p class="text-muted">List of users with moderation actions</p>

  <div class="card p-3">
    <div *ngIf="users?.length; else noUsers">
      <div class="table-responsive">
        <table class="table table-hover table-sm">
          <thead>
            <tr>
              <th>Email / Username</th>
              <th>Roles</th>
              <th>Active</th>
              <th style="width:200px">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let u of users">
              <td>
                <div class="fw-bold">{{ u.username }}</div>
                <div class="text-muted small">{{ u.email }}</div>
              </td>
              <td><span class="badge bg-secondary">{{ u.roles || 'USER' }}</span></td>
              <td>{{ u.isActive ? 'Yes' : 'No' }}</td>
              <td>
                <button class="btn btn-sm btn-warning me-2" *ngIf="u.isActive" (click)="banUser(u.id)">Ban</button>
                <button class="btn btn-sm btn-success me-2" *ngIf="!u.isActive" (click)="unbanUser(u.id)">Unban</button>
                <button class="btn btn-sm btn-danger" (click)="deleteUser(u.id)">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <ng-template #noUsers>
      <div class="text-muted">No users found.</div>
    </ng-template>
  </div>
</div>
